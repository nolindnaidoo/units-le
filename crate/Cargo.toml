[package]
name = "units-le"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
description = "Extract every quantity with its unit, normalized, and refuse the ambiguous ones by name"
authors = ["Nolin D Naidoo"]
homepage = "https://letools.dev/tools/units-le"
repository = "https://github.com/nolindnaidoo/units-le"
keywords = ["units", "extract", "audit", "duration", "cli"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
# What a consumer gets, and why.
#
# Ships: src/, Cargo.toml, Cargo.lock, LICENSE, README.md — needed to
# build the binary. SPEC.md and CHANGELOG.md — the behavioural contract
# someone scripting against the exit codes and the refusal reasons
# needs. tests/ and fixtures/ — not needed to *build*, but needed to
# *verify*: `cargo test` on the unpacked tarball runs the whole corpus,
# so the refusal claims in the README are checkable by whoever installed
# it rather than taken on trust.
#
# Excluded: AGENTS.md and CLAUDE.md are how this repo is worked on, not
# how the tool is used. rust-toolchain.toml is a convenience for
# contributors to *this* checkout; shipped, it would pin the toolchain
# of anyone who unpacks or vendors the crate, which is not this crate's
# business.
exclude = ["AGENTS.md", "CLAUDE.md", "rust-toolchain.toml"]

[dependencies]
# The report is the product on stdout, and `derive` keeps its shape in
# the types themselves — one place, rather than a hand-written writer
# that drifts from the structs it claims to print.
serde = { version = "1", features = ["derive"] }
# stdout is JSON Lines and the agent surface is JSON-RPC. No
# `raw_value`, unlike numbers-le: every quantity here is reported as a
# string and every other number in a report is a small integer, so there
# is no numeric token whose spelling this crate has to control.
serde_json = "1"
# The five format parsers. The same choices as the numbers-le crate, for
# the same reason — a document that parses there parses here.
#
# JSON, with every loosening off, so a file this reads is a file
# `JSON.parse` reads.
jsonc-parser = "0.33"
# `preserve_order`, without which a TOML table iterates alphabetically
# and extraction stops following the document, which is the order this
# tool's whole output contract is.
toml = { version = "1", features = ["preserve_order"] }
# INI, read with escape processing off: `\U` in a value is a Windows
# path, not an escape.
rust-ini = "0.21"
# YAML 1.2 with the core schema, which is what `30s` being a *string*
# rather than a typed scalar depends on.
saphyr = "0.0.11"
# CSV, read with no header row of its own and a flexible record length —
# a ragged row is data rather than a failure.
csv = "1"
# The walker. `ignore` is ripgrep's, so "what this tool walks" and "what
# ripgrep walks" are the same answer — which is the answer a person
# auditing a repository already has in their head.
ignore = "0.4"

# No `byte-unit`, `humantime`, `duration-str` or `uom`. Each of them
# resolves the cases this tool exists to refuse — `1.5KB` becomes 1500,
# a bare `m` becomes minutes or millis depending on the crate — and a
# dependency that guesses is a dependency that decides the audit. The
# grammar in `extract/grammar.rs` is pinned here, in one file, with the
# refusals as first-class results. No regex engine either: the grammar
# is a hand-written lexer, so there is nothing a pattern would express
# more clearly.

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
# Not a debug aid. Every base value here is an integer multiplication —
# a `PiB` count against 2^50 — and a release build that wrapped would
# report a confident, wrong number of bytes. The arithmetic is checked
# and refuses on overflow; this is the backstop that makes a missed
# check a crash rather than a lie.
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
